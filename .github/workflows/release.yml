name: Release
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type release to publish the version in package.json
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  package:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: javascript
          path: dist/*.*
  native:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'release'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.13'
      - run: npm ci --ignore-scripts
      - run: npm run build:native
      - name: Exercise the standalone installation without Node on PATH
        shell: bash
        run: |
          PLATFORM=$(node -p 'process.platform+"-"+process.arch')
          EXT=$(node -p 'process.platform==="win32"?".exe":""')
          export ZESIA_NATIVE_TEST_BIN="$PWD/dist/native/$PLATFORM/scripts/zesia$EXT"
          node --test test/standalone.test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ matrix.os }}
          path: dist/zesia-runtime-*
  publish:
    needs: [package, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true
      - name: Publish immutable source-bound assets only after every platform passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/verify-native-assets.mjs
          VERSION=$(node -p 'JSON.parse(require("fs").readFileSync("package.json","utf8")).version')
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo 'This version already exists. Bump package.json before publishing.' >&2
            exit 1
          fi
          mapfile -t ASSETS < <(find dist -maxdepth 1 -type f -print | sort)
          gh release create "v$VERSION" "${ASSETS[@]}" --target "$GITHUB_SHA" --title "v$VERSION" --notes 'Built and tested from this exact source commit. Shared online review and standalone clients; checksums, licenses and source metadata attached.'
